name: CostBook
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"

targets:
  CostBook:
    type: application
    platform: iOS
    sources:
      - path: CostBook
        excludes:
          - "Info.plist"
    info:
      path: CostBook/Info.plist
      properties:
        CFBundleDisplayName: 小账本
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: 用于锁定你的账本，防止他人查看。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.costbook
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: NO
